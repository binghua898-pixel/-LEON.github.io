<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Macro Map & Live Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 420px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 24px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 24px; border-bottom: 1px solid #334155; background: #111827; }
        .sidebar-header h1 { margin: 0 0 8px 0; font-size: 20px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .sidebar-header p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.4; }
        #event-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .event-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s ease; position: relative; }
        .event-card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .event-card.active { border-color: #38bdf8; background: #172554; box-shadow: 0 0 15px rgba(56,189,248,0.15); }
        .badge { display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 4px; background: #0284c7; color: #e0f2fe; margin-bottom: 8px; }
        .event-title { font-size: 15px; font-weight: 600; margin: 0 0 8px 0; color: #f1f5f9; line-height: 1.3; }
        .metric-box { background: #1e293b; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid #334155; }
        .metric-label { font-size: 12px; color: #94a3b8; }
        .metric-value { font-size: 15px; font-weight: 700; color: #38bdf8; }
        .summary-text { font-size: 13px; color: #cbd5e1; margin: 0; line-height: 1.4; }
        #map { flex: 1; height: 100%; background: #0b0f19; }
        .loading-state { text-align: center; color: #94a3b8; padding: 40px 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1>🌍 Global Macro Monitor</h1>
            <p>Live-syncing with Google Sheets. Click any card to inspect on map.</p>
        </div>
        <div id="event-list">
            <div class="loading-state">Loading live data from Google Sheet...</div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 你的专属谷歌表格实时 CSV 数据源链接
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnqSOJECSax4lYREgbx-QJtjOsEgwldUNNWjOpTp8yWilyUkEdmzIshiRydc6mHBsOEkppmgAsW/pub?output=csv';

        // 初始化地图
        const map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 使用稳定免费的开源底图（无需任何 API Key）
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};
        let activeMarkerId = null;

        // 加载并解析 Google Sheets CSV 数据
        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                if (!data || data.length === 0 || !data[0].headline) {
                    document.getElementById('event-list').innerHTML = `<div class="loading-state" style="color:#ef4444;">Data loaded, but format looks empty or incorrect. Please check your Google Sheet headers.</div>`;
                    return;
                }
                renderApp(data);
            },
            error: function(err) {
                document.getElementById('event-list').innerHTML = `<div class="loading-state" style="color:#ef4444;">Failed to load data. Please check if your Google Sheet is published to web as CSV.</div>`;
            }
        });

        function renderApp(events) {
            const listContainer = document.getElementById('event-list');
            listContainer.innerHTML = '';

            events.forEach((item, index) => {
                const lat = parseFloat(item.lat);
                const lng = parseFloat(item.lng);
                const id = item.id || `event-${index}`;

                if (!item.headline) return; // 跳过空行

                // 1. 创建左侧卡片
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <span class="badge">${item.category || 'Macro'}</span>
                    <h3 class="event-title">${item.headline}</h3>
                    <div class="metric-box">
                        <span class="metric-label">${item.metric_label || 'Key Metric'}</span>
                        <span class="metric-value">${item.metric_value}</span>
                    </div>
                    <p class="summary-text">${item.summary}</p>
                `;

                card.addEventListener('click', () => {
                    selectEvent(id, lat, lng, card);
                });

                listContainer.appendChild(card);

                // 2. 在地图上打点
                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#38bdf8',
                        color: '#ffffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`<b>${item.headline}</b><br>${item.metric_label}: ${item.metric_value}`);
                    
                    marker.on('click', () => {
                        selectEvent(id, lat, lng, card);
                    });

                    markers[id] = { marker, card, lat, lng };
                }
            });
        }

        function selectEvent(id, lat, lng, cardElement) {
            // 移除旧的高亮
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
            cardElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // 移动地图视角
            if (!isNaN(lat) && !isNaN(lng)) {
                map.flyTo([lat, lng], 5, { duration: 1.2 });
                if (markers[id]) {
                    markers[id].marker.openPopup();
                }
            }
        }
    </script>
</body>
</html>
